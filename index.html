<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HindiFlix - Movies & Drama</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      background: #111116;
      padding: 16px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #e50914;
      letter-spacing: 1px;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #e50914;
    }

    .hero {
      padding: 40px 5%;
      background: linear-gradient(180deg, #161622 0%, #0b0b0f 100%);
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      max-width: 600px;
      line-height: 1.5;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      max-width: 600px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #29292f;
      outline: none;
      border-radius: 8px;
      background: #19191f;
      color: white;
      font-size: 15px;
    }

    .search-box button {
      border: 0;
      padding: 0 24px;
      border-radius: 8px;
      background: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    section {
      padding: 20px 5% 40px;
    }

    section h2 {
      margin-bottom: 18px;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .movie-card {
      background: #15151b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s;
      border: 1px solid #222;
      display: flex;
      flex-direction: column;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      border-color: #e50914;
    }

    .movie-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #202028;
    }

    .movie-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .movie-info h3 {
      font-size: 14px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-info p {
      color: #aaa;
      font-size: 12px;
      margin-top: auto;
    }

    .loading {
      color: #aaa;
      padding: 20px 0;
      font-size: 14px;
    }

    /* MODAL & VIDEO PLAYER */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 999;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: #15151b;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #29292f;
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-content {
      padding: 20px;
    }

    .modal-content h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .modal-content p {
      color: #bbb;
      line-height: 1.6;
      font-size: 14px;
      margin-top: 10px;
    }

    .modal-close {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #e50914;
      color: white;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      border-top: 1px solid #222;
      margin-top: 40px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">HindiFlix</div>
    <nav>
      <a href="#movies">মুভি</a>
      <a href="#drama">ড্রামা/সিরিজ</a>
    </nav>
  </header>

  <section class="hero">
    <h1>হিন্দি মুভি এবং ড্রামা সিরিজ</h1>
    <p>সর্বশেষ প্রকাশিত হিন্দি মুভি ও ওয়েব সিরিজ দেখুন সরাসরি।</p>

    <div class="search-box">
      <input type="text" placeholder="মুভি বা ড্রামার নাম লিখে খুঁজুন...">
      <button onclick="doSearch()">Search</button>
    </div>
  </section>

  <section id="movies">
    <h2>🎬 লেটেস্ট হিন্দি মুভি</h2>
    <div class="movies" id="movieGrid">
      <p class="loading">মুভি লোড হচ্ছে...</p>
    </div>
  </section>

  <section id="drama">
    <h2>📺 জনপ্রিয় ড্রামা ও ওয়েব সিরিজ</h2>
    <div class="movies" id="dramaGrid">
      <p class="loading">ড্রামা লোড হচ্ছে...</p>
    </div>
  </section>

  <footer>
    <p>HindiFlix &copy; 2026</p>
  </footer>

  <script>
    // TMDB Public Read API Key
    const TMDB_KEY = "8414ff0f96035414f48b598b965f3a0a";
    const IMG_BASE = "https://image.tmdb.org/t/p/w500";

    const movieGrid = document.getElementById("movieGrid");
    const dramaGrid = document.getElementById("dramaGrid");
    const searchInput = document.querySelector(".search-box input");

    let currentList = [];

    // ১. লেটেস্ট হিন্দি মুভি লোড করা (স্বয়ংক্রিয়ভাবে নতুন মুভি আসবে)
    async function fetchMovies() {
      try {
        const res = await fetch(
          `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_original_language=hi&sort_by=primary_release_date.desc&vote_count.gte=10&page=1`
        );
        const data = await res.json();
        renderItems(data.results, movieGrid, 'movie');
      } catch (err) {
        movieGrid.innerHTML = "<p class='loading'>মুভি লোড করা যায়নি।</p>";
      }
    }

    // ২. জনপ্রিয় হিন্দি ড্রামা/সিরিজ লোড করা
    async function fetchDramas() {
      try {
        const res = await fetch(
          `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_original_language=hi&sort_by=popularity.desc&page=1`
        );
        const data = await res.json();
        renderItems(data.results, dramaGrid, 'tv');
      } catch (err) {
        dramaGrid.innerHTML = "<p class='loading'>ড্রামা লোড করা যায়নি।</p>";
      }
    }

    // গ্রিডে আইটেমগুলো সাজানো
    function renderItems(items, container, type) {
      if (!items || !items.length) {
        container.innerHTML = "<p class='loading'>কিছু পাওয়া যায়নি।</p>";
        return;
      }

      container.innerHTML = items.map(item => {
        const title = item.title || item.name || "Unknown";
        const date = (item.release_date || item.first_air_date || "").slice(0, 4);
        const poster = item.poster_path 
          ? IMG_BASE + item.poster_path 
          : "https://via.placeholder.com/300x450?text=No+Poster";

        return `
          <div class="movie-card" onclick="openPlayer(${item.id}, '${type}', '${escapeHTML(title)}', '${escapeHTML(item.overview)}')">
            <img src="${poster}" alt="${escapeHTML(title)}" loading="lazy">
            <div class="movie-info">
              <h3>${escapeHTML(title)}</h3>
              <p>⭐ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'} • ${date || 'Hindi'}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    // ৩. ভিডিও প্লেয়ার মডাল (ক্লিক করলে প্লে হবে)
    function openPlayer(id, type, title, overview) {
      document.body.style.overflow = "hidden"; // স্ক্রল বন্ধ রাখবে

      // ফ্রী এম্বেড ভিডিও স্ট্রিমিং সোর্স
      const streamUrl = type === 'movie' 
        ? `https://vidsrc.to/embed/movie/${id}`
        : `https://vidsrc.to/embed/tv/${id}/1/1`; // সিজন ১, এপিসোড ১ ডিফল্ট প্লে হবে

      const modalHtml = `
        <div id="videoModal" class="modal-bg" onclick="closePlayer()">
          <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closePlayer()">✕</button>
            <div class="player-container">
              <iframe src="${streamUrl}" allowfullscreen></iframe>
            </div>
            <div class="modal-content">
              <h2>${title}</h2>
              <p>${overview || "কোনো বিবরণ পাওয়া যায়নি।"}</p>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML("beforeend", modalHtml);
    }

    function closePlayer() {
      const modal = document.getElementById("videoModal");
      if (modal) {
        modal.remove();
        document.body.style.overflow = "";
      }
    }

    // কীবোর্ডের Esc চাপলে প্লেয়ার বন্ধ হওয়া
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePlayer();
    });

    // ৪. সার্চ ফাংশন
    async function doSearch() {
      const query = searchInput.value.trim();
      if (!query) {
        fetchMovies();
        fetchDramas();
        return;
      }

      movieGrid.innerHTML = "<p class='loading'>খোঁজা হচ্ছে...</p>";
      dramaGrid.innerHTML = "";

      try {
        const res = await fetch(
          `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`
        );
        const data = await res.json();
        const results = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
        renderItems(results, movieGrid, 'movie');
      } catch (e) {
        movieGrid.innerHTML = "<p class='loading'>সার্চে কোনো ফলাফল পাওয়া যায়নি।</p>";
      }
    }

    searchInput.addEventListener("keyup", (e) => {
      if (e.key === "Enter") doSearch();
    });

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // অ্যাপ চালু
    fetchMovies();
    fetchDramas();
  </script>
</body>
</html>
