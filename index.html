<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HindiFlix - Hindi Movies & Drama</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111116;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #e50914;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: #e50914;
    }

    .hero {
      padding: 55px 5%;
      background:
        linear-gradient(
          90deg,
          #0b0b0f 20%,
          rgba(11,11,15,.65),
          #0b0b0f
        );
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      max-width: 600px;
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-top: 25px;
      max-width: 650px;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      border: 0;
      outline: none;
      border-radius: 7px;
      background: #19191f;
      color: white;
    }

    .search-box button {
      border: 0;
      padding: 0 20px;
      border-radius: 7px;
      background: #e50914;
      color: white;
      font-weight: bold;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 20px 5%;
    }

    .category {
      background: #19191f;
      color: #ddd;
      border: 1px solid #29292f;
      padding: 9px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active,
    .category:hover {
      background: #e50914;
      color: white;
    }

    section {
      padding: 20px 5% 40px;
    }

    section h2 {
      margin-bottom: 20px;
    }

    .movies {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }

    .movie-card {
      background: #15151b;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: .25s;
      border: 1px solid #222;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      border-color: #e50914;
    }

    .movie-card img {
      width: 100%;
      height: 225px;
      object-fit: cover;
      display: block;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-info h3 {
      font-size: 15px;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-info p {
      color: #aaa;
      font-size: 12px;
    }

    .movie-info small {
      display: block;
      margin-top: 7px;
      color: #888;
    }

    .loading {
      color: #aaa;
      padding: 20px 0;
    }

    /* MODAL */

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 999;
      overflow-y: auto;
      padding: 30px 15px;
    }

    .modal-box {
      background: #15151b;
      max-width: 850px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #29292f;
    }

    .modal-box > img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
    }

    .modal-content {
      padding: 22px;
    }

    .modal-content h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .modal-content p {
      color: #bbb;
      line-height: 1.7;
      margin: 10px 0;
    }

    .modal-close {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #e50914;
      color: white;
      font-size: 25px;
      cursor: pointer;
      z-index: 5;
    }

    .season {
      margin-top: 20px;
      background: #101015;
      padding: 15px;
      border-radius: 8px;
    }

    .season h4 {
      margin-bottom: 10px;
      color: #e50914;
    }

    .episode {
      padding: 11px 5px;
      border-bottom: 1px solid #25252b;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .episode:last-child {
      border-bottom: 0;
    }

    .episode span {
      color: #777;
      white-space: nowrap;
    }

    .watch-btn {
      display: inline-block;
      margin-top: 15px;
      background: #e50914;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 7px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      border-top: 1px solid #222;
      margin-top: 30px;
      font-size: 13px;
    }

    footer a {
      color: #aaa;
    }

    @media (max-width: 600px) {

      .hero {
        padding: 40px 5%;
      }

      .hero h1 {
        font-size: 30px;
      }

      .movies {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .movie-card img {
        height: 230px;
      }

      nav a {
        margin-left: 8px;
        font-size: 12px;
      }

      .episode {
        flex-direction: column;
      }

    }

  </style>

</head>

<body>


<header>

  <div class="logo">
    HindiFlix
  </div>

  <nav>
    <a href="#home">Home</a>
    <a href="#movies">Movies</a>
    <a href="#drama">Drama</a>
  </nav>

</header>


<section class="hero" id="home">

  <h1>
    Hindi Movies & Drama
  </h1>

  <p>
    Discover Hindi movies and Indian dramas
    with automatically updated information.
  </p>

  <div class="search-box">

    <input
      type="text"
      placeholder="Search movies or dramas..."
    >

    <button>
      Search
    </button>

  </div>

</section>


<div class="categories">

  <button class="category active">
    All
  </button>

  <button class="category">
    Drama
  </button>

  <button class="category">
    Action
  </button>

  <button class="category">
    Comedy
  </button>

  <button class="category">
    Romance
  </button>

</div>


<section id="movies">

  <h2>
    🎬 Hindi Movies
  </h2>

  <div class="movies">

    <p class="loading">
      Loading Hindi Movies...
    </p>

  </div>

</section>


<section id="drama">

  <h2>
    📺 Hindi & Indian Drama
  </h2>

  <div class="movies">

    <p class="loading">
      Loading Dramas...
    </p>

  </div>

</section>


<footer>

  <p>
    HindiFlix © 2026
  </p>

  <p style="margin-top:8px">

    TV data by
    <a
      href="https://www.tvmaze.com"
      target="_blank"
      rel="noopener">
      TVmaze
    </a>

  </p>

</footer>


<script>

/* =========================
   GLOBAL DATA
========================= */

const movieGrid =
  document.querySelector("#movies .movies");

const dramaGrid =
  document.querySelector("#drama .movies");

const searchInput =
  document.querySelector(".search-box input");

const searchBtn =
  document.querySelector(".search-box button");

let allShows = [];
let allMovies = [];

let currentFilter = "All";


/* =========================
   MOVIES - WIKIDATA
========================= */

async function loadHindiMovies() {

  movieGrid.innerHTML = `
    <p class="loading">
      Loading Hindi Movies...
    </p>
  `;

  const query = `
SELECT DISTINCT
  ?movie
  ?movieLabel
  ?date
  ?image
WHERE {

  ?movie
    wdt:P31/wdt:P279* wd:Q11424 ;
    wdt:P364 wd:Q1568 .

  OPTIONAL {
    ?movie wdt:P577 ?date .
  }

  OPTIONAL {
    ?movie wdt:P18 ?image .
  }

  SERVICE wikibase:label {
    bd:serviceParam
      wikibase:language "en,hi".
  }

}
ORDER BY DESC(?date)
LIMIT 60
`;

  try {

    const url =
      "https://query.wikidata.org/sparql?query=" +
      encodeURIComponent(query) +
      "&format=json";

    const response =
      await fetch(url);

    const data =
      await response.json();

    allMovies =
      data.results.bindings;

    renderMovies(allMovies);

  } catch (error) {

    console.error(error);

    movieGrid.innerHTML = `
      <p class="loading">
        Movie data failed to load.
        Please refresh.
      </p>
    `;

  }
}


function renderMovies(movies) {

  if (!movies.length) {

    movieGrid.innerHTML = `
      <p class="loading">
        No Hindi movies found.
      </p>
    `;

    return;
  }

  movieGrid.innerHTML =
    movies.map(movie => {

      const title =
        movie.movieLabel?.value ||
        "Hindi Movie";

      const year =
        movie.date?.value
          ? movie.date.value.substring(0,4)
          : "";

      const image =
        movie.image?.value ||
        "https://via.placeholder.com/300x450?text=Hindi+Movie";

      return `
        <div class="movie-card">

          <img
            src="${image}"
            alt="${escapeHTML(title)}"
            loading="lazy"
          >

          <div class="movie-info">

            <h3>
              ${escapeHTML(title)}
            </h3>

            <p>
              🇮🇳 Hindi
              ${year ? " • " + year : ""}
            </p>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   DRAMAS - TVMAZE
========================= */

async function loadDramas() {

  dramaGrid.innerHTML = `
    <p class="loading">
      Loading Dramas...
    </p>
  `;

  try {

    const queries = [
      "Hindi",
      "Indian",
      "Hindi drama",
      "Indian drama"
    ];

    const results =
      await Promise.all(

        queries.map(q =>

          fetch(
            "https://api.tvmaze.com/search/shows?q=" +
            encodeURIComponent(q)
          ).then(r => r.json())

        )

      );


    const map = new Map();


    results.flat().forEach(item => {

      const show = item.show;

      if (
        !show ||
        !show.name ||
        !show.image
      ) return;


      const excluded = [
        "Reality",
        "Game Show",
        "Talk Show",
        "Food",
        "Sports",
        "News"
      ];


      if (
        show.genres?.some(g =>
          excluded.includes(g)
        )
      ) return;


      map.set(show.id, show);

    });


    allShows =
      [...map.values()]
        .sort(
          (a,b) =>
            (b.rating?.average || 0) -
            (a.rating?.average || 0)
        )
        .slice(0, 40);


    renderDramas(allShows);


  } catch(error) {

    console.error(error);

    dramaGrid.innerHTML = `
      <p class="loading">
        Drama data failed to load.
      </p>
    `;

  }

}


function renderDramas(shows) {

  const filtered =
    shows.filter(show => {

      if (
        currentFilter === "All"
      ) return true;

      return show.genres?.includes(
        currentFilter
      );

    });


  if (!filtered.length) {

    dramaGrid.innerHTML = `
      <p class="loading">
        No dramas found.
      </p>
    `;

    return;

  }


  dramaGrid.innerHTML =
    filtered.map(show => {

      const poster =
        show.image?.medium ||
        show.image?.original;


      return `
        <div
          class="movie-card"
          onclick="openDrama(${show.id})"
        >

          <img
            src="${poster}"
            alt="${escapeHTML(show.name)}"
            loading="lazy"
          >

          <div class="movie-info">

            <h3>
              ${escapeHTML(show.name)}
            </h3>

            <p>
              ⭐
              ${show.rating?.average || "N/A"}
              •
              ${show.premiered?.slice(0,4) || ""}
            </p>

            <small>
              ${
                show.genres
                  ?.slice(0,2)
                  .join(" • ")
                || "Drama"
              }
            </small>

          </div>

        </div>
      `;

    }).join("");

}


/* =========================
   DRAMA DETAILS
========================= */

async function openDrama(id) {

  const show =
    allShows.find(
      s => s.id === id
    );

  if (!show) return;


  document.body.insertAdjacentHTML(
    "beforeend",

    `
    <div
      id="dramaModal"
      class="modal-bg"
      onclick="closeDrama()"
    >

      <div
        class="modal-box"
        onclick="event.stopPropagation()"
      >

        <button
          class="modal-close"
          onclick="closeDrama()"
        >
          ×
        </button>


        <img
          src="${
            show.image?.original ||
            show.image?.medium
          }"
          alt=""
        >


        <div class="modal-content">

          <h2>
            ${escapeHTML(show.name)}
          </h2>


          <p>
            ⭐
            ${show.rating?.average || "N/A"}
            •
            ${show.premiered?.slice(0,4) || ""}
          </p>


          <p>
            ${
              show.genres?.join(" • ")
              || "Drama"
            }
          </p>


          <p>
            ${
              cleanText(show.summary)
              ||
              "No description available."
            }
          </p>


          <a
            class="watch-btn"
            href="${
              show.officialSite ||
              show.url
            }"
            target="_blank"
            rel="noopener noreferrer"
          >
            Official / Info
          </a>


          <h3
            style="margin-top:25px"
          >
            Seasons & Episodes
          </h3>


          <div id="episodeList">

            Loading episodes...

          </div>


        </div>

      </div>

    </div>
    `
  );


  try {

    const response =
      await fetch(
        `https://api.tvmaze.com/shows/${id}/episodes`
      );


    const episodes =
      await response.json();


    renderEpisodes(episodes);


  } catch(error) {

    const box =
      document.getElementById(
        "episodeList"
      );


    if (box) {

      box.innerHTML =
        "<p>Episodes could not be loaded.</p>";

    }

  }

}


/* =========================
   EPISODES
========================= */

function renderEpisodes(episodes) {

  const box =
    document.getElementById(
      "episodeList"
    );


  if (!box) return;


  if (!episodes.length) {

    box.innerHTML =
      "<p>No episodes available.</p>";

    return;

  }


  const seasons = {};


  episodes.forEach(ep => {

    if (!seasons[ep.season])
      seasons[ep.season] = [];


    seasons[ep.season].push(ep);

  });


  box.innerHTML =
    Object.keys(seasons)
      .sort((a,b) => b-a)
      .map(season => {

        return `
          <div class="season">

            <h4>
              Season ${season}
            </h4>

            ${
              seasons[season]
                .map(ep => `

                  <div class="episode">

                    <strong>

                      E${ep.number}
                      —
                      ${escapeHTML(ep.name)}

                    </strong>

                    <span>

                      ${ep.airdate || ""}

                    </span>

                  </div>

                `)
                .join("")
            }

          </div>
        `;

      })
      .join("");

}


function closeDrama() {

  const modal =
    document.getElementById(
      "dramaModal"
    );

  if (modal)
    modal.remove();

}


/* =========================
   SEARCH
========================= */

function doSearch() {

  const q =
    searchInput.value
      .trim()
      .toLowerCase();


  if (!q) {

    renderMovies(allMovies);
    renderDramas(allShows);

    return;

  }


  const movies =
    allMovies.filter(movie => {

      const title =
        movie.movieLabel?.value
          ?.toLowerCase() || "";

      return title.includes(q);

    });


  const dramas =
    allShows.filter(show =>

      show.name
        .toLowerCase()
        .includes(q)

    );


  renderMovies(movies);
  renderDramas(dramas);

}


if (searchBtn) {

  searchBtn.addEventListener(
    "click",
    doSearch
  );

}


if (searchInput) {

  searchInput.addEventListener(
    "keyup",
    e => {

      if (e.key === "Enter")
        doSearch();

    }
  );

}


/* =========================
   CATEGORY FILTER
========================= */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".category")
          .forEach(b =>
            b.classList.remove("active")
          );


        button.classList.add("active");


        const value =
          button.textContent.trim();


        currentFilter =
          [
            "All",
            "Drama",
            "Action",
            "Comedy",
            "Romance"
          ].includes(value)
            ? value
            : "All";


        renderDramas(allShows);

      }
    );

  });


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function cleanText(text) {

  if (!text) return "";

  return text
    .replace(/<[^>]*>/g, "")
    .trim();

}


/* =========================
   START EVERYTHING
========================= */

loadHindiMovies();
loadDramas();

</script>


</body>
</html>
