<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HindiFlix - Movies & Drama</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0b0f; color: #fff; font-family: 'Segoe UI', sans-serif; }
    header { background: #111116; padding: 16px 5%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 26px; font-weight: bold; color: #e50914; letter-spacing: 1px; }
    .hero { padding: 40px 5%; background: linear-gradient(180deg, #161622 0%, #0b0b0f 100%); }
    .hero h1 { font-size: 30px; margin-bottom: 10px; }
    .hero p { color: #aaa; font-size: 14px; line-height: 1.5; }
    .search-box { display: flex; gap: 10px; margin-top: 25px; max-width: 600px; }
    .search-box input { flex: 1; padding: 12px 16px; border: 1px solid #29292f; border-radius: 8px; background: #19191f; color: white; outline: none; }
    .search-box button { border: 0; padding: 0 24px; border-radius: 8px; background: #e50914; color: white; font-weight: bold; cursor: pointer; }
    section { padding: 20px 5% 40px; }
    section h2 { margin-bottom: 18px; font-size: 20px; }
    .movies { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media(min-width: 600px){ .movies { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; } }
    .movie-card { background: #15151b; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #222; }
    .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #202028; }
    .movie-info { padding: 10px; }
    .movie-info h3 { font-size: 13px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-info p { color: #aaa; font-size: 11px; }
    .loading { color: #aaa; padding: 20px 0; font-size: 14px; grid-column: 1/-1; text-align: center; }
    
    /* MODAL */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; align-items: center; justify-content: center; padding: 15px; }
    .modal-box { background: #15151b; width: 100%; max-width: 850px; border-radius: 10px; border: 1px solid #29292f; position: relative; }
    .player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .modal-close { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; background: #e50914; color: white; border: 0; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 10; }
    .modal-content { padding: 15px; }
    .modal-content h2 { font-size: 18px; margin-bottom: 5px; }
    .modal-content p { color: #bbb; font-size: 13px; line-height: 1.5; max-height: 80px; overflow-y: auto; }
    .controls { padding: 10px 15px; background: #101015; border-bottom: 1px solid #222; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; }
    .controls select, .controls input { background: #1a1a24; color: white; border: 1px solid #333; padding: 5px; border-radius: 4px; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">HindiFlix</div>
  </header>

  <section class="hero">
    <h1>হিন্দি মুভি এবং ড্রামা সিরিজ</h1>
    <p>সর্বশেষ প্রকাশিত হিন্দি মুভি ও ওয়েব সিরিজ দেখুন সরাসরি।</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="মুভি বা ড্রামার নাম লিখে খুঁজুন...">
      <button onclick="doSearch()">Search</button>
    </div>
  </section>

  <section id="movies">
    <h2>🎬 লেটেস্ট হিন্দি মুভি</h2>
    <div class="movies" id="movieGrid">
      <p class="loading">মুভি লোড হচ্ছে...</p>
    </div>
  </section>

  <section id="drama">
    <h2>📺 জনপ্রিয় ড্রামা ও ওয়েব সিরিজ</h2>
    <div class="movies" id="dramaGrid">
      <p class="loading">ড্রামা লোড হচ্ছে...</p>
    </div>
  </section>

  <!-- Video Player Modal -->
  <div class="modal-bg" id="videoModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closePlayer()">✕</button>
      
      <div class="controls">
        <label>সার্ভার: 
          <select id="serverChoice" onchange="updatePlayer()">
            <option value="vidsrc_icu">সার্ভার ১ (Fast)</option>
            <option value="vidsrc_cc">সার্ভার ২</option>
            <option value="smashystream">সার্ভার ৩</option>
          </select>
        </label>
        <span id="tvControls" style="display:none; gap: 10px;">
          <label>সিজন: <input type="number" id="sNum" value="1" min="1" style="width:40px" onchange="updatePlayer()"></label>
          <label>পর্ব: <input type="number" id="eNum" value="1" min="1" style="width:40px" onchange="updatePlayer()"></label>
        </span>
      </div>

      <div class="player-container">
        <iframe id="videoFrame" allowfullscreen></iframe>
      </div>
      <div class="modal-content">
        <h2 id="modalTitle">Title</h2>
        <p id="modalDesc">Desc</p>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "8414ff0f96035414f48b598b965f3a0a";
    const IMG_BASE = "https://image.tmdb.org/t/p/w500";
    
    let activeMedia = { id: null, type: 'movie' };

    // ব্যাকআপ ডাটা (ইন্টারনেট ব্লক থাকলেও এগুলো লোড হবে)
    const backupMovies = [
      { id: 872585, title: "Oppenheimer", vote_average: 8.1, release_date: "2023", poster_path: "/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" },
      { id: 799883, title: "Dunki", vote_average: 7.2, release_date: "2023", poster_path: "/46Dbk62bsp7zGfx7f3e8f85f34.jpg" },
      { id: 872906, title: "Jawan", vote_average: 7.3, release_date: "2023", poster_path: "/jA2a6mP8m3b4lK2i0iW3x6vK8.jpg" },
      { id: 1034541, title: "Fighter", vote_average: 6.8, release_date: "2024", poster_path: "/zDZowwb9GZGEctAu2PCpjiPQAMM.jpg" },
      { id: 1111622, title: "Animal", vote_average: 7.2, release_date: "2023", poster_path: "/xM4U9A608oEK9h69GkU2uLgC1r1.jpg" },
      { id: 784651, title: "Pathaan", vote_average: 6.7, release_date: "2023", poster_path: "/43aZhtYVj0n8AHT1UHTv3Nq8M2K.jpg" }
    ];

    const backupDramas = [
      { id: 94997, name: "Panchayat", vote_average: 8.5, first_air_date: "2020", poster_path: "/9k0v03v1eZqZkL0e2c842p8g001.jpg" },
      { id: 80986, name: "Mirzapur", vote_average: 8.4, first_air_date: "2018", poster_path: "/k7K77c7xYn7F2k55zW8k0M0349.jpg" },
      { id: 82250, name: "Sacred Games", vote_average: 8.6, first_air_date: "2018", poster_path: "/uG0t670L5s4p3.jpg" },
      { id: 111803, name: "Farzi", vote_average: 8.3, first_air_date: "2023", poster_path: "/wA286o1h29b8c0D0VayJ6q32jT6.jpg" },
      { id: 120168, name: "The Family Man", vote_average: 8.5, first_air_date: "2019", poster_path: "/eA28zFhN0kI8N1nSyyfR6n3FDEa.jpg" },
      { id: 157293, name: "Asur", vote_average: 8.6, first_air_date: "2020", poster_path: "/xI6I7D9l6y28sQWb2u1l33W1L9Q.jpg" }
    ];

    async function loadContent() {
      // 1. Load Movies
      try {
        const mRes = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc&page=1`);
        if(!mRes.ok) throw new Error();
        const mData = await mRes.json();
        renderItems(mData.results, 'movieGrid', 'movie');
      } catch (err) {
        renderItems(backupMovies, 'movieGrid', 'movie'); // Network blocked, load backup
      }

      // 2. Load Dramas
      try {
        const dRes = await fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc&page=1`);
        if(!dRes.ok) throw new Error();
        const dData = await dRes.json();
        renderItems(dData.results, 'dramaGrid', 'tv');
      } catch (err) {
        renderItems(backupDramas, 'dramaGrid', 'tv'); // Network blocked, load backup
      }
    }

    function renderItems(items, gridId, type) {
      const container = document.getElementById(gridId);
      if (!items || items.length === 0) {
        container.innerHTML = "<p class='loading'>কোনো কনটেন্ট পাওয়া যায়নি।</p>";
        return;
      }
      container.innerHTML = items.map(item => {
        const title = item.title || item.name;
        const date = (item.release_date || item.first_air_date || "").slice(0, 4);
        const poster = item.poster_path ? (IMG_BASE + item.poster_path) : "https://placehold.co/300x450/19191f/fff?text=No+Poster";
        const cleanTitle = title.replace(/['"]/g, "");
        const cleanOverview = (item.overview || "কোনো বিবরণ নেই।").replace(/['"]/g, "");
        
        return `
          <div class="movie-card" onclick="openPlayer(${item.id}, '${type}', '${cleanTitle}', '${cleanOverview}')">
            <img src="${poster}" alt="${cleanTitle}" loading="lazy">
            <div class="movie-info">
              <h3>${cleanTitle}</h3>
              <p>⭐ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'} • ${date || 'Hindi'}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    function openPlayer(id, type, title, overview) {
      activeMedia = { id, type };
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalDesc").innerText = overview;
      document.getElementById("tvControls").style.display = (type === 'tv') ? 'flex' : 'none';
      document.getElementById("sNum").value = 1;
      document.getElementById("eNum").value = 1;
      
      updatePlayer();
      document.getElementById("videoModal").style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function updatePlayer() {
      const { id, type } = activeMedia;
      const srv = document.getElementById("serverChoice").value;
      const s = document.getElementById("sNum").value || 1;
      const e = document.getElementById("eNum").value || 1;
      let url = "";

      if(srv === 'vidsrc_icu') {
        url = type === 'movie' ? `https://vidsrc.icu/embed/movie/${id}` : `https://vidsrc.icu/embed/tv/${id}/${s}/${e}`;
      } else if (srv === 'vidsrc_cc') {
        url = type === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;
      } else {
        url = type === 'movie' ? `https://embed.smashystream.com/playere.php?tmdb=${id}` : `https://embed.smashystream.com/playere.php?tmdb=${id}&season=${s}&episode=${e}`;
      }
      document.getElementById("videoFrame").src = url;
    }

    function closePlayer() {
      document.getElementById("videoModal").style.display = "none";
      document.getElementById("videoFrame").src = "";
      document.body.style.overflow = "";
    }

    loadContent();
  </script>
</body>
</html>
