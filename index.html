<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HindiFlix - হাজারো মুভি ও ড্রামা</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a10; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    header { background: #11121a; padding: 14px 5%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e202d; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: 800; color: #e50914; }
    
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #181a26; color: #bbb; border: 1px solid #282a3d; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tab-btn.active, .tab-btn:hover { background: #e50914; color: #fff; border-color: #e50914; }

    .hero { padding: 30px 5% 10px; text-align: center; }
    .hero h1 { font-size: 28px; margin-bottom: 8px; }
    .hero p { color: #8f94a6; font-size: 13px; }
    
    .search-box { display: flex; gap: 8px; margin: 20px auto 0; max-width: 480px; }
    .search-box input { flex: 1; padding: 10px 14px; border: 1px solid #282a3d; border-radius: 6px; background: #141520; color: #fff; outline: none; }
    .search-box button { background: #e50914; color: #fff; border: 0; padding: 0 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    main { padding: 20px 5% 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    
    .card { background: #12131c; border: 1px solid #1e202d; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-4px); border-color: #e50914; }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #181a26; display: block; }
    .card-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .card-info h3 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info span { font-size: 11px; color: #f59e0b; margin-top: 4px; }

    .loader { text-align: center; padding: 25px; color: #888; font-size: 14px; }

    /* Modal Player */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .modal-box { background: #12131c; width: 100%; max-width: 900px; border-radius: 10px; overflow: hidden; border: 1px solid #282a3d; position: relative; }
    .close-btn { position: absolute; right: 12px; top: 10px; background: #e50914; border: 0; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; }
    
    .controls { padding: 10px 15px; background: #181a26; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; border-bottom: 1px solid #282a3d; }
    .controls select, .controls input { background: #0e0f17; color: #fff; border: 1px solid #2e3247; padding: 6px 10px; border-radius: 4px; outline: none; }
    
    .player-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    
    .details { padding: 15px; }
    .details h2 { font-size: 18px; margin-bottom: 6px; }
    .details p { font-size: 13px; color: #9da3af; line-height: 1.5; max-height: 100px; overflow-y: auto; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .controls { gap: 6px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">HindiFlix</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('movie')">মুভি</button>
      <button class="tab-btn" onclick="switchTab('tv')">ড্রামা/সিরিজ</button>
    </div>
  </header>

  <div class="hero">
    <h1 id="heroTitle">হিন্দি মুভি কালেকশন</h1>
    <p>নিচে স্ক্রল করতে থাকলে অটোমেটিক নতুন কনটেন্ট লোড হতে থাকবে।</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="সার্চ করুন...">
      <button onclick="handleSearch()">Search</button>
    </div>
  </div>

  <main>
    <div class="grid" id="contentGrid"></div>
    <div class="loader" id="loader">লোড হচ্ছে...</div>
  </main>

  <!-- Video Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closePlayer()">✕</button>
      
      <div class="controls">
        <label>সার্ভার:
          <select id="serverChoice" onchange="renderVideoSource()">
            <option value="vidsrc_icu">সার্ভার ১ (VidSrc ICU)</option>
            <option value="vidsrc_cc">সার্ভার ২ (VidSrc CC)</option>
            <option value="smashystream">সার্ভার ৩ (SmashyStream)</option>
          </select>
        </label>

        <!-- সিরিজ পর্ব সিলেকশন -->
        <span id="tvControls" style="display:none; gap: 8px; align-items: center;">
          <label>সিজন: <input type="number" id="seasonNum" value="1" min="1" style="width:50px" onchange="renderVideoSource()"></label>
          <label>পর্ব: <input type="number" id="episodeNum" value="1" min="1" style="width:55px" onchange="renderVideoSource()"></label>
        </span>
      </div>

      <div class="player-wrap">
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
      </div>
      <div class="details">
        <h2 id="modalTitle">শিরোনাম</h2>
        <p id="modalDesc">বিবরণ</p>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "8414ff0f96035414f48b598b965f3a0a";
    const IMG_PATH = "https://image.tmdb.org/t/p/w500";

    let currentType = 'movie'; // 'movie' অথবা 'tv'
    let currentPage = 1;
    let isLoading = false;
    let isSearchActive = false;
    let activeMedia = { id: null, type: 'movie' };

    const grid = document.getElementById("contentGrid");
    const loader = document.getElementById("loader");

    // ট্যাব পরিবর্তন (Movie বা TV Show)
    function switchTab(type) {
      if (currentType === type && !isSearchActive) return;
      currentType = type;
      isSearchActive = false;
      currentPage = 1;
      grid.innerHTML = "";
      
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      
      document.getElementById("heroTitle").innerText = type === 'movie' ? "হিন্দি মুভি কালেকশন" : "জনপ্রিয় হিন্দি ড্রামা ও সিরিজ";
      loadItems();
    }

    // ডেটা ফেচিং ফাংশন (পেজিনেশন সহ)
    async function loadItems() {
      if (isLoading) return;
      isLoading = true;
      loader.innerText = "আরও কনটেন্ট লোড হচ্ছে...";
      loader.style.display = "block";

      const url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc&page=${currentPage}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.results && data.results.length) {
          appendItems(data.results);
          currentPage++;
        } else {
          loader.innerText = "আর কোনো কনটেন্ট নেই।";
        }
      } catch (err) {
        loader.innerText = "ডেটা লোড করতে সমস্যা হয়েছে।";
      } finally {
        isLoading = false;
      }
    }

    // আইটেমগুলো স্ক্রিনে যোগ করা
    function appendItems(list) {
      list.forEach(item => {
        const title = item.title || item.name;
        const date = (item.release_date || item.first_air_date || "").slice(0, 4);
        const poster = item.poster_path ? (IMG_PATH + item.poster_path) : "https://placehold.co/300x450/141520/ffffff?text=No+Poster";
        const cleanTitle = title.replace(/'/g, "");
        const cleanOverview = (item.overview || "কোনো বিবরণ নেই").replace(/'/g, "");

        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openPlayer(item.id, currentType, cleanTitle, cleanOverview);
        card.innerHTML = `
          <img src="${poster}" alt="${cleanTitle}" loading="lazy">
          <div class="card-info">
            <h3>${cleanTitle}</h3>
            <span>★ ${item.vote_average ? item.vote_average.toFixed(1) : "N/A"} • ${date || 'Hindi'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ইনফিনিট স্ক্রোল লজিক
    window.addEventListener("scroll", () => {
      if (isSearchActive) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        loadItems();
      }
    });

    // প্লেয়ার চালু করা
    function openPlayer(id, type, title, desc) {
      activeMedia = { id, type };
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalDesc").innerText = desc;
      document.getElementById("tvControls").style.display = type === 'tv' ? 'inline-flex' : 'none';
      
      // রিসেট সিজন/পর্ব
      document.getElementById("seasonNum").value = 1;
      document.getElementById("episodeNum").value = 1;

      renderVideoSource();
      document.getElementById("videoModal").style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    // সার্ভার ও ভিডিও ফ্রেম সেট করা
    function renderVideoSource() {
      const { id, type } = activeMedia;
      const server = document.getElementById("serverChoice").value;
      const s = document.getElementById("seasonNum").value || 1;
      const e = document.getElementById("episodeNum").value || 1;
      let url = "";

      if (server === "vidsrc_icu") {
        url = type === 'movie' 
          ? `https://vidsrc.icu/embed/movie/${id}`
          : `https://vidsrc.icu/embed/tv/${id}/${s}/${e}`;
      } else if (server === "vidsrc_cc") {
        url = type === 'movie' 
          ? `https://vidsrc.cc/v2/embed/movie/${id}`
          : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;
      } else {
        url = type === 'movie'
          ? `https://embed.smashystream.com/playere.php?tmdb=${id}`
          : `https://embed.smashystream.com/playere.php?tmdb=${id}&season=${s}&episode=${e}`;
      }

      document.getElementById("videoFrame").src = url;
    }

    function closePlayer() {
      document.getElementById("videoModal").style.display = "none";
      document.getElementById("videoFrame").src = "";
      document.body.style.overflow = "";
    }

    // কীবোর্ড Esc হ্যান্ডলার
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePlayer();
    });

    // সার্চ হ্যান্ডলার
    async function handleSearch() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) {
        isSearchActive = false;
        currentPage = 1;
        grid.innerHTML = "";
        loadItems();
        return;
      }

      isSearchActive = true;
      grid.innerHTML = "";
      loader.innerText = "খোঁজা হচ্ছে...";

      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data.results && data.results.length) {
          appendItems(data.results);
          loader.innerText = `মোট ${data.results.length} টি ফলাফল পাওয়া গেছে।`;
        } else {
          loader.innerText = "কিছু পাওয়া যায়নি।";
        }
      } catch (err) {
        loader.innerText = "সার্চে ত্রুটি হয়েছে।";
      }
    }

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSearch();
    });

    // প্রথম লোড
    loadItems();
  </script>
</body>
</html>
