<script>
const dramaGrid = document.querySelector("#drama .movies");
const searchInput = document.querySelector(".search-box input");
const searchBtn = document.querySelector(".search-box button");

let allShows = [];
let currentFilter = "All";

async function loadDramas() {
  dramaGrid.innerHTML = `
    <p style="color:#aaa;padding:20px">
      Loading Hindi dramas...
    </p>
  `;

  try {
    const searches = ["Hindi", "Indian", "Hindi drama", "Indian drama"];

    const results = await Promise.all(
      searches.map(q =>
        fetch(
          "https://api.tvmaze.com/search/shows?q=" +
          encodeURIComponent(q)
        ).then(r => r.json())
      )
    );

    const map = new Map();

    results.flat().forEach(item => {
      const show = item.show;

      if (!show || !show.name) return;
      if (!show.image) return;

      const badGenres = [
        "Reality",
        "Game Show",
        "Talk Show",
        "Food",
        "Sports",
        "News"
      ];

      if (show.genres?.some(g => badGenres.includes(g))) return;

      map.set(show.id, show);
    });

    allShows = [...map.values()]
      .sort((a, b) =>
        (b.rating?.average || 0) -
        (a.rating?.average || 0)
      )
      .slice(0, 30);

    renderDramas(allShows);

  } catch (error) {
    console.error(error);

    dramaGrid.innerHTML = `
      <p style="color:#ff5555;padding:20px">
        Drama data load failed. Please refresh.
      </p>
    `;
  }
}

function renderDramas(shows) {

  const filtered = shows.filter(show => {

    if (currentFilter === "All") return true;

    return show.genres?.includes(currentFilter);
  });

  if (!filtered.length) {
    dramaGrid.innerHTML = `
      <p style="color:#aaa;padding:20px">
        No dramas found.
      </p>
    `;
    return;
  }

  dramaGrid.innerHTML = filtered.map(show => {

    const poster =
      show.image?.medium ||
      show.image?.original ||
      "https://via.placeholder.com/300x450?text=No+Poster";

    const rating =
      show.rating?.average
        ? show.rating.average.toFixed(1)
        : "N/A";

    const year =
      show.premiered
        ? show.premiered.substring(0, 4)
        : "N/A";

      <div class="movie-card"
           onclick="showDetails(${show.id})">

        <img
          src="${poster}"
          alt="${escapeHTML(show.name)}"
          loading="lazy"
        >

        <div class="movie-info">
          <h3>${escapeHTML(show.name
