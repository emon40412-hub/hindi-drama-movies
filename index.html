<script>
const dramaGrid = document.querySelector("#drama .movies");
const searchInput = document.querySelector(".search-box input");
const searchBtn = document.querySelector(".search-box button");

let allShows = [];
let currentFilter = "All";

async function loadDramas() {
  dramaGrid.innerHTML = `
    <p style="color:#aaa;padding:20px">
      Loading dramas...
    </p>
  `;

  try {
    const queries = [
      "Hindi",
      "Indian",
      "Hindi drama",
      "Indian drama"
    ];

    const results = await Promise.all(
      queries.map(q =>
        fetch(
          "https://api.tvmaze.com/search/shows?q=" +
          encodeURIComponent(q)
        ).then(r => r.json())
      )
    );

    const map = new Map();

    results.flat().forEach(item => {
      const show = item.show;

      if (!show || !show.name || !show.image) return;

      const excluded = [
        "Reality",
        "Game Show",
        "Talk Show",
        "Food",
        "Sports",
        "News"
      ];

      if (
        show.genres?.some(g =>
          excluded.includes(g)
        )
      ) return;

      map.set(show.id, show);
    });

    allShows = [...map.values()]
      .sort(
        (a,b) =>
          (b.rating?.average || 0) -
          (a.rating?.average || 0)
      )
      .slice(0, 30);

    renderDramas(allShows);

  } catch (error) {

    console.error(error);

    dramaGrid.innerHTML = `
      <p style="color:#f55;padding:20px">
        Failed to load dramas.
      </p>
    `;
  }
}


function renderDramas(shows) {

  const filtered = shows.filter(show => {

    if (currentFilter === "All")
      return true;

    return show.genres?.includes(
      currentFilter
    );
  });

  dramaGrid.innerHTML =
    filtered.map(show => {

      const poster =
        show.image?.medium ||
        show.image?.original;

      return `
        <div
          class="movie-card"
          onclick="openDrama(${show.id})"
        >

          <img
            src="${poster}"
            alt="${escapeHTML(show.name)}"
            loading="lazy"
          >

          <div class="movie-info">

            <h3>
              ${escapeHTML(show.name)}
            </h3>

            <p>
              ⭐ ${show.rating?.average || "N/A"}
              • ${show.premiered?.slice(0,4) || ""}
            </p>

            <small>
              ${show.genres?.slice(0,2).join(" • ") || "Drama"}
            </small>

          </div>

        </div>
      `;

    }).join("");
}


async function openDrama(id) {

  const show =
    allShows.find(s => s.id === id);

  if (!show) return;

  document.body.insertAdjacentHTML(
    "beforeend",

    `
    <div id="dramaModal"
         class="modal-bg">

      <div class="modal-box">

        <button
          class="modal-close"
          onclick="closeDrama()">
          ×
        </button>

        <img
          src="${show.image?.original || show.image?.medium}"
          alt=""
        >

        <div class="modal-content">

          <h2>
            ${escapeHTML(show.name)}
          </h2>

          <p>
            ⭐ ${show.rating?.average || "N/A"}
          </p>

          <p>
            ${show.genres?.join(" • ") || "Drama"}
          </p>

          <p>
            ${cleanText(show.summary) ||
              "No description available
